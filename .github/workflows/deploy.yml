# Checks the layout, then publishes the site to Cloudflare when main changes.
#
# Merging a pull request only updates GitHub — it does not touch the Worker
# that serves hvjaparentteacherconference.upham51.workers.dev. Before this
# existed, every deploy had to be done by hand with `npx wrangler deploy`, so
# merged changes could sit invisible on main indefinitely.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN
#   Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#   -> "Edit Cloudflare Workers" template, then add it under
#   GitHub -> Settings -> Secrets and variables -> Actions.
# The account is already pinned in wrangler.toml, so no other secret is needed.

name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Opens the real page at the window sizes people actually use and fails if
  # anything overlaps. A card that covered the conference times shipped once
  # because it only broke on windows shorter than the one it was built on.
  layout:
    name: Layout check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: layout
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The action defaults to wrangler 3.90.0, which warns it is too old
          # to be safe. Match what a local `npx wrangler deploy` would use.
          wranglerVersion: "4"
